[package]
name = "orbit-vst3-synth-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "VST3 monophonic sine synth test-oracle for orbit-vst3-host"
publish = false

[lib]
name = "orbit_vst3_synth_oracle"
path = "src/lib.rs"
# #553: cdylib は VST3 バンドル用。rlib を併記して **Rust のテストから仕様の式
# （`voice_frequency_hz`）と state エンコードを参照**できるようにする — 期待値を
# 実装からハードコードせず式から導出するため（E2E_HARNESS_SPEC の改ざん耐性）。
crate-type = ["cdylib", "rlib"]

[dependencies]
vst3 = "0.3"
