name: Rust advisories

# RustSec の勧告（`cargo deny check advisories`）を回す（#1030）。
#
# rust-ci.yml の `license / dependency gate` から分けた理由: advisories の結果は Cargo.lock
# だけでなく**実行した日の RustSec DB** で決まる。全 PR で回すと、勧告が 1 件公開された日から
# 依存を変えていない PR（docs だけの PR を含む）まで一斉に赤くなる。2026-10-26 に
# RUSTSEC-2026-0386（tokio）が公開され、Rust CI が全 PR で落ちた（#999）。
# 赤の帰属ができないゲートは慣れで死ぬ（#801 と同じクラス）。
#
# cargo-deny-action の README も "Recommended pipeline if using advisories, to avoid sudden
# breakages" として advisories を bans / licenses / sources から分けている（あちらは
# continue-on-error で赤を流す形。ここは無関係な PR では回さない形にした）。
#
# 何がいつ止まるか:
# - **依存を変える PR**（下の paths）: その PR の lock に勧告のある版があれば赤。
#   依存を触っている PR は `cargo update -p <crate>` で直せる位置にいる
# - **毎日の main**（schedule）: 既存の依存に新しい勧告が出たら赤。新しい勧告を最初に
#   知らせるのはこの経路
# - **手動**（workflow_dispatch）: 直した後の確認用
#
# 🔴 このファイル自身は paths に入れていない。結果を決めるのはこのファイルではなく
# Cargo.lock と DB なので、ワークフローを直すだけの PR が main の既存の勧告で赤くなるのは
# 上と同じ衝突になる。このファイルを変えたら、マージ後に workflow_dispatch で回して確かめる。

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'rust/Cargo.lock'
      - 'rust/Cargo.toml'
      - 'rust/**/Cargo.toml'
      - 'rust/deny.toml'
  schedule:
    # 毎日 21:23 UTC = 06:23 JST（毎時 0 分は混むのでずらす）
    - cron: '23 21 * * *'
  workflow_dispatch:

jobs:
  advisories:
    name: advisory gate (RustSec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    env:
      # rust-ci.yml の cargo-deny job と同じ理由（crates.io sparse-index の transient blip）。
      CARGO_NET_RETRY: "10"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo-deny check advisories
        run: cargo deny check advisories
