name: CI/CD - Test, Build, and Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  code-review:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Build project
      run: npm run build

    - name: Lint code
      run: npm run lint

    # `tests/` は build の references にも入っておらず、eslint は未定義変数の参照のような
    # 意味論エラーを見ない。その隙間から gated E2E に**実行時に必ず ReferenceError で落ちる**
    # 未定義変数が出荷された（#639 レビュー）。実機ゲートは手動起動なので、CI で型が通ることを
    # 確かめておかないと「走らせた瞬間に落ちる」状態に気づけない。
    - name: Typecheck gated E2E
      run: npm run typecheck:e2e
