name: Rust CI

# Rust workspace (rust/) の検証。既存 code-review.yml は npm/TS のみを回しており
# Rust は CI で一切検証されていなかった（Issue #326）。本 job が fmt / clippy /
# test / license-gate を PR ごとに回す。
#
# スコープ（Issue #326 / 限界を明文化・#625）:
# - **ubuntu-latest** で permissive + cross-platform な default グラフを検証する。
#   macOS ランナーはコストが高いため GitHub CI では回さない（owner 方針）。
# - `link-audio` feature(GPL・Ableton Link・build.rs が macOS 専用)は ubuntu で
#   ビルド不可かつ GPL 隔離方針のため CI では有効化しない。`clap-host`(permissive)は検証する。
#
# 🔴 **この job が保証しないもの（#625 で判明・過大評価しないこと）**:
#   child crate 群（`orbit-vst3-effect-child` / `orbit-vst3-instrument-child` /
#   `orbit-clap-*-child`）は `#[cfg(target_os = "macos")]` で本体を、
#   `#[cfg(not(target_os = "macos"))]` で「macOS 専用です」と即エラー終了するスタブを定義する。
#   ubuntu ランナーは **後者しかコンパイルしない**ので、**実際に出荷される macOS 実装は
#   この job では一度も検証されない**。#625 でこの job が落ちた時に捕まえたのも、
#   スタブ側の cfg 不整合であって製品コードの欠陥ではなかった。
#
#   したがってこの job の green は「**移植可能な部分が壊れていない**」ことの証明であって、
#   「出荷物が動く」ことの証明ではない。後者は **main が手元 macOS で回すマージ前ゲート**
#   （`npm run build:clean` + 実機 gated E2E・CLAUDE.md「マージ前ゲート」）が担う。
#   **この job だけを根拠にマージしないこと。**
# - `outproc-effect` feature(γ M1 PR-C・clack-free・default off)も検証する(clack を child に隔離した
#   OOP effect 経路。非 gated lib test を CI で回す)。
# - 実機 output device / multicast を要する gated テストは全て `#[ignore]` なので
#   `cargo test` で自動的に skip される（CI に audio device は無い）。

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  rust:
    name: fmt / clippy / test
    # 🔴 ubuntu のまま。macOS ランナーはコストが高いので GitHub CI では回さない（owner 方針）。
    # この job が何を保証し **何を保証しないか** はファイル冒頭のスコープ注記を参照。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ALSA dev headers (cpal backend)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Setup Rust toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy (clap-host feature)
        run: cargo clippy -p orbit-audio-daemon --features clap-host --all-targets --locked -- -D warnings

      # γ M1 PR-C: out-of-process effect (clack-free・default off)。adapter / supervisor / 観測 seam の
      # non-gated lib test と clippy を CI 対象にする。clap-host とは feature 排他。
      - name: Clippy (outproc-effect feature)
        run: cargo clippy -p orbit-audio-daemon --features outproc-effect --all-targets --locked -- -D warnings

      # 🔴 `outproc-instrument` 単独と both build を CI の視野に入れる。
      # ここが死角だったため、`--features outproc-instrument` 単独のビルドが
      # コンパイルエラーのまま main に載っていた（テストの cfg が呼び先のメソッドより
      # 緩く、both build でしか存在しないメソッドを参照していた）。
      # 出荷経路は常に both build なので成果物は無事だったが、単独 feature で
      # `cargo test` を叩いた開発者が理由の分からないエラーに当たる状態だった。
      - name: Clippy (outproc-instrument feature)
        run: cargo clippy -p orbit-audio-daemon --features outproc-instrument --all-targets --locked -- -D warnings

      # 出荷時に実際に使う組み合わせ（release.yml / copy-daemon-bin.sh と同じ）。
      - name: Clippy (outproc-effect + outproc-instrument, the shipped combination)
        run: cargo clippy -p orbit-audio-daemon --features outproc-effect,outproc-instrument --all-targets --locked -- -D warnings

      - name: Test (default features, gated tests auto-skipped)
        run: cargo test --workspace --locked

      - name: Test (clap-host feature, gated tests auto-skipped)
        run: cargo test -p orbit-audio-daemon --features clap-host --locked

      - name: Test (outproc-effect feature, gated tests auto-skipped)
        run: cargo test -p orbit-audio-daemon --features outproc-effect --locked

      - name: Test (outproc-instrument feature, gated tests auto-skipped)
        run: cargo test -p orbit-audio-daemon --features outproc-instrument --locked

      - name: Test (outproc-effect + outproc-instrument, the shipped combination)
        run: cargo test -p orbit-audio-daemon --features outproc-effect,outproc-instrument --locked

  cargo-deny:
    name: license / dependency gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    env:
      # cargo-deny は `cargo metadata` 経由で crates.io sparse-index を更新する。
      # runner では index 取得が HTTP2/SSL の transient blip で失敗することがある
      # （観測例: "Error in the HTTP2 framing layer" / "unexpected eof while reading"）。
      # 既定の retry 回数では落ちたため引き上げる。registry は下の rust-cache でも温める。
      CARGO_NET_RETRY: "10"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # cargo-deny 自体は cargo を要するが、この job は build しないため registry が
      # 毎回 cold になり network に依存する。toolchain + cache で registry index を
      # 温め、cold fetch（= flake 源）への露出を減らす。
      - name: Setup Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # default グラフ(link-audio off)が GPL-free であることを assert する。
      # GPL 隔離 crate orbit-link-audio は [workspace] exclude かつ default-off feature
      # 経由でしか graph に入らないため、ここに GPL が現れたら隔離が壊れている。
      - name: cargo-deny check
        run: cargo deny check
